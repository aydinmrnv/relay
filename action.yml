# Relay, as a GitHub Action.
#
# For teams who would rather not run a daemon. It is the same pipeline `relay
# serve` runs, on one issue, in CI: the trigger label, the allowlist, the
# per-run budget and the delivery ceiling are all read from the repository's
# own `.relay/config.json`, not from the inputs below. There is deliberately no
# input that can loosen a guardrail, because a workflow file is editable by
# anyone who can open a pull request against it.
#
# ---------------------------------------------------------------------------
# What a runner does not remember
# ---------------------------------------------------------------------------
# A hosted runner starts every job from a fresh checkout, so the run state
# `relay serve` keeps on a long-lived machine — `.relay/runs/` and
# `.relay/unattended.json` — is not there from one job to the next. Two things
# that rest on it are therefore weaker here than under `relay serve`, and it is
# better to know that than to find out:
#
# - `unattended.maxDailyCostUsd` still has to be set, but each job sees only
#   its own run, so the day's total never accumulates and never stops anything.
#   What bounds spending in CI is `unattended.maxRunCostUsd` per run, who is on
#   the allowlist, and the workflow's own `concurrency:`.
# - `relay stats` has no history to report. The record of a run made here is
#   the comment Relay posts on the issue and this job's summary and log. To
#   keep the whole run directory, upload `.relay/runs/` as an artifact in a
#   step after this one.
#
# Removing the label before the run starts is what stops the same issue being
# run twice; that part needs no memory.
#
# ---------------------------------------------------------------------------
# Credentials
# ---------------------------------------------------------------------------
# This is the one place Relay's rule about credentials needs saying precisely,
# because CI is where somebody will otherwise assume it is fine to hand Relay
# a token.
#
# Relay reads no model credential and no GitHub credential, here or anywhere.
# What this Action does is put each vendor's own environment variable into
# that vendor's own process: `GH_TOKEN` is read by `gh`, `ANTHROPIC_API_KEY` by
# Claude Code, `OPENAI_API_KEY` by Codex. Relay spawns those CLIs and they
# inherit the environment; it never reads, logs, forwards or persists any of
# those values, and it has no input, flag or config key that accepts one. Set
# the vendor's variable in the job's `env:` from repository secrets and let the
# vendor's CLI find it.
#
# The one credential Relay does read itself is `LINEAR_API_KEY`, and only when
# an issue lives in Linear: Linear has no CLI to delegate to. It is not used by
# this Action, which acts on GitHub labels.
#
# A run started here has nobody watching it, so it also keeps secrets away from
# the agents: variables whose names look like secrets are withheld from each
# coding CLI and from the test suite, except that CLI's own sign-in. `gh` gets
# `GH_TOKEN`; the model does not. `unattended.allowEnv` in `.relay/config.json`
# names anything else they are allowed to see. See docs/cli.md, "Untrusted
# input".
#
# The secret scan still runs between commit and push, so a change carrying
# something credential-shaped stops at the branch in CI exactly as it does on a
# laptop.
name: Relay
description: Run Relay on a labelled issue and open a draft pull request.
author: NullStack.one

branding:
  icon: git-pull-request
  color: purple

inputs:
  issue:
    # No expression syntax in this text, not even quoted: GitHub evaluates
    # action metadata, and an expression here fails every workflow using the
    # Action before its first step runs.
    description: >-
      Issue to consider, as a number. Usually `github.event.issue.number` from
      an `issues.labeled` trigger.
    required: true
  label:
    description: >-
      Trigger label to require. Defaults to `workflow.triggerLabel` in
      .relay/config.json, which is where it belongs — an issue that does not
      carry it is ignored either way.
    required: false
    default: ''
  working-directory:
    description: Directory holding the checked-out repository.
    required: false
    default: '.'
  version:
    description: >-
      Which build of the Relay CLI to install. `latest` is the newest build of
      main that passed CI; a version number such as `0.1.0` is that release,
      which never changes once published. Both are downloaded from this
      repository's GitHub releases, not from the npm registry. `local` runs the
      copy in the checkout, which is what this repository's own CI does.
    required: false
    default: latest
  args:
    description: Extra arguments appended to `relay serve`.
    required: false
    default: ''

outputs:
  exit-code:
    description: Relay's exit code, from the documented table in docs/cli.md.
    value: ${{ steps.relay.outputs.exit-code }}
  run-id:
    description: The run this Action started, or empty when it started nothing.
    value: ${{ steps.relay.outputs.run-id }}
  stopped-by:
    description: Why it stopped — `once`, `budget`, `kill-switch` or `signal`.
    value: ${{ steps.relay.outputs.stopped-by }}
  started:
    description: '`true` when a run was started, `false` when the issue was ignored.'
    value: ${{ steps.relay.outputs.started }}

runs:
  using: composite
  steps:
    # Every value that comes from the workflow — an input, another step's
    # output — reaches a script through `env:` and is read as a shell variable.
    # None is written into a `run:` block as an expression: an expression is
    # pasted into the script before the shell parses it, so an input of
    # `$(curl … | sh)` would be a command, not a string.
    - name: Install Relay
      shell: bash
      env:
        RELAY_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ "$RELAY_VERSION" = "local" ]; then
          echo "RELAY_BIN=$ACTION_PATH/bin/relay.mjs" >> "$GITHUB_ENV"
          exit 0
        fi

        # The CLI is published as a tarball on this repository's releases:
        # `cli-latest` rolls forward with every build of main that passed CI,
        # and `cli-v<version>` is cut once per version and never replaced.
        # It is deliberately not installed from the npm registry by name — a
        # name is whoever registered it, and what runs here has the job's
        # tokens in its environment.
        case "$RELAY_VERSION" in
          latest) tag=cli-latest ;;
          '' | *[!0-9A-Za-z.+-]*)
            echo "::error::version must be 'latest', 'local' or a version number such as 0.1.0 (got '$RELAY_VERSION')."
            exit 1
            ;;
          *) tag="cli-v${RELAY_VERSION#v}" ;;
        esac
        # Overridable so a mirror can serve the same layout — which is also how
        # this repository's CI installs the tarball it has just built, through
        # this exact path, before any release exists to download.
        base="${RELAY_RELEASE_BASE:-https://github.com/aydinmrnv/relay/releases/download}"

        # Into a prefix of its own rather than the runner's global one: nothing
        # to be root for on a self-hosted runner, and nothing left on PATH.
        prefix="${RUNNER_TEMP:-/tmp}/relay-cli"
        npm install --global --prefix "$prefix" --no-audit --no-fund "$base/$tag/relay.tgz"
        echo "RELAY_BIN=$(npm root --global --prefix "$prefix")/relay-orchestrator/bin/relay.mjs" >> "$GITHUB_ENV"

    - name: Identify the committer
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Only if the job has not already set one. Relay commits the work it
        # writes, and git refuses to commit without a name to put on it.
        git config user.name >/dev/null 2>&1 || git config user.name "github-actions[bot]"
        git config user.email >/dev/null 2>&1 || \
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Run Relay
      id: relay
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RELAY_ISSUE: ${{ inputs.issue }}
        RELAY_LABEL: ${{ inputs.label }}
        RELAY_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        node "$RELAY_BIN" --version
        stream="${RUNNER_TEMP:-/tmp}/relay-serve.jsonl"
        label_args=()
        if [ -n "$RELAY_LABEL" ]; then label_args=(--label "$RELAY_LABEL"); fi

        # `--json` puts the document on stdout and everything meant for a person
        # on stderr, so the log stays readable while the stream stays parseable.
        # `${a[@]+"${a[@]}"}` rather than `"${a[@]}"`: an empty array under
        # `set -u` is an error on the bash 3.2 that macOS runners still ship.
        # shellcheck disable=SC2086
        node "$RELAY_BIN" serve --once --issue "$RELAY_ISSUE" \
          ${label_args[@]+"${label_args[@]}"} $RELAY_ARGS --json | tee "$stream"
        code=${PIPESTATUS[0]}

        # The runs stream their own JSON on the same stdout, and they have
        # summary lines too — so match on the command as well as the type.
        summary=$(grep '"command":"serve"' "$stream" | grep '"type":"summary"' | tail -1 || true)
        read_field() {
          [ -z "$summary" ] && { echo ""; return; }
          printf '%s' "$summary" | node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => { raw += chunk; });
            process.stdin.on('end', () => {
              try {
                const value = JSON.parse(raw);
                const field = process.argv[1];
                if (field === 'run-id') process.stdout.write(value.started?.[0]?.runId ?? '');
                else if (field === 'started') process.stdout.write(String((value.started ?? []).length > 0));
                else process.stdout.write(String(value.stoppedBy ?? ''));
              } catch { process.stdout.write(''); }
            });
          " "$1"
        }

        {
          echo "exit-code=$code"
          echo "run-id=$(read_field run-id)"
          echo "started=$(read_field started)"
          echo "stopped-by=$(read_field stopped-by)"
        } >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Summarise the run
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RELAY_ISSUE: ${{ inputs.issue }}
        RELAY_STARTED: ${{ steps.relay.outputs.started }}
        RELAY_RUN_ID: ${{ steps.relay.outputs.run-id }}
        RELAY_EXIT_CODE: ${{ steps.relay.outputs.exit-code }}
        RELAY_STOPPED_BY: ${{ steps.relay.outputs.stopped-by }}
      run: |
        set -uo pipefail
        # Relay posts its own summary to the issue — an unattended run always
        # comments, because nobody is watching the terminal it ran in. This is
        # the other audience: the job page, for whoever is reading the Action.
        {
          echo "## Relay"
          echo
          if [ "$RELAY_STARTED" = "true" ]; then
            echo "Started \`$RELAY_RUN_ID\` for issue #$RELAY_ISSUE, exit $RELAY_EXIT_CODE."
            echo
            echo '```'
            node "$RELAY_BIN" status "$RELAY_RUN_ID" 2>&1 || true
            echo '```'
            echo
            echo "This summary, the job log and Relay's comment on the issue are the record of this run."
            echo "The run directory under \`.relay/runs/\` is gone when the job ends unless a later step uploads it."
          else
            echo "Nothing was started for issue #$RELAY_ISSUE (${RELAY_STOPPED_BY:-no result})."
            echo
            echo "Relay ignores an issue that does not carry the trigger label, and refuses one whose"
            echo "label came from somebody outside \`unattended.authors\`/\`unattended.teams\`. The job log"
            echo "above says which."
          fi
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
