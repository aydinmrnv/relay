<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" fill="none">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity="0.35"/></pattern>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="960" height="600" rx="16" fill="#0b0b0f"/>
  <rect x="1" y="1" width="958" height="598" rx="15" stroke="#27272a"/>
  <rect x="1" y="1" width="958" height="598" rx="15" fill="url(#dots)"/>
  <g font-family="ui-sans-serif, system-ui" font-size="13">
    <!-- edges -->
    <path d="M232 300 C 270 300, 270 300, 308 300" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M472 288 C 510 288, 510 300, 548 300" stroke="#a1a1aa" stroke-width="2"/>
    <path d="M472 316 C 520 316, 520 430, 548 430" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M712 300 C 750 300, 750 300, 788 300" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M712 300 C 750 300, 750 170, 788 170" stroke="#8b5cf6" stroke-width="2"/>
    <!-- trigger -->
    <g transform="translate(68 268)">
      <rect width="164" height="64" rx="12" fill="#18181b" stroke="#5e6ad2" stroke-width="1.5"/>
      <rect width="4" height="64" rx="2" fill="#5e6ad2"/>
      <circle cx="26" cy="32" r="12" fill="#5e6ad2" opacity="0.2"/>
      <text x="50" y="26" fill="#a1a1aa" font-size="9" letter-spacing="1">TRIGGER</text>
      <text x="50" y="44" fill="#fafafa" font-weight="600">Issue assigned</text>
      <circle cx="164" cy="32" r="5" fill="#0ea5e9" stroke="#0b0b0f" stroke-width="2"/>
    </g>
    <!-- budget gate -->
    <g transform="translate(308 268)">
      <rect width="164" height="64" rx="12" fill="#18181b" stroke="#27272a"/>
      <circle cx="26" cy="32" r="12" fill="#0f766e" opacity="0.25"/>
      <text x="50" y="26" fill="#a1a1aa" font-size="9" letter-spacing="1">GUARDRAILS</text>
      <text x="50" y="44" fill="#fafafa" font-weight="600">Budget gate</text>
      <circle cx="0" cy="32" r="5" fill="#a1a1aa" stroke="#0b0b0f" stroke-width="2"/>
      <circle cx="164" cy="20" r="5" fill="#a1a1aa" stroke="#0b0b0f" stroke-width="2"/>
      <circle cx="164" cy="48" r="5" fill="#a1a1aa" stroke="#0b0b0f" stroke-width="2"/>
    </g>
    <!-- pipeline -->
    <g transform="translate(548 256)">
      <rect width="164" height="88" rx="12" fill="#18181b" stroke="url(#g)" stroke-width="2"/>
      <circle cx="26" cy="32" r="12" fill="#7c3aed" opacity="0.25"/>
      <text x="50" y="26" fill="#a1a1aa" font-size="9" letter-spacing="1">AGENT PIPELINE</text>
      <text x="50" y="44" fill="#fafafa" font-weight="600">Run the pipeline</text>
      <text x="50" y="62" fill="#c4b5fd" font-size="11">Code review · round 1/2</text>
      <rect x="14" y="72" width="136" height="4" rx="2" fill="#27272a"/>
      <rect x="14" y="72" width="92" height="4" rx="2" fill="url(#g)"/>
      <circle cx="0" cy="44" r="5" fill="#0ea5e9" stroke="#0b0b0f" stroke-width="2"/>
      <circle cx="164" cy="44" r="5" fill="#8b5cf6" stroke="#0b0b0f" stroke-width="2"/>
    </g>
    <!-- refused notify -->
    <g transform="translate(548 398)">
      <rect width="164" height="64" rx="12" fill="#18181b" stroke="#27272a" opacity="0.7"/>
      <circle cx="26" cy="32" r="12" fill="#4a154b" opacity="0.5"/>
      <text x="50" y="26" fill="#a1a1aa" font-size="9" letter-spacing="1">SLACK</text>
      <text x="50" y="44" fill="#fafafa" font-weight="600">Say it was refused</text>
      <circle cx="0" cy="32" r="5" fill="#a1a1aa" stroke="#0b0b0f" stroke-width="2"/>
    </g>
    <!-- delivery -->
    <g transform="translate(788 268)">
      <rect width="164" height="64" rx="12" fill="#18181b" stroke="#27272a"/>
      <circle cx="26" cy="32" r="12" fill="#2563eb" opacity="0.25"/>
      <text x="50" y="26" fill="#a1a1aa" font-size="9" letter-spacing="1">DELIVERY</text>
      <text x="50" y="44" fill="#fafafa" font-weight="600">Draft pull request</text>
      <circle cx="0" cy="32" r="5" fill="#8b5cf6" stroke="#0b0b0f" stroke-width="2"/>
    </g>
    <!-- comment -->
    <g transform="translate(788 138)">
      <rect width="164" height="64" rx="12" fill="#18181b" stroke="#27272a"/>
      <circle cx="26" cy="32" r="12" fill="#2563eb" opacity="0.25"/>
      <text x="50" y="26" fill="#a1a1aa" font-size="9" letter-spacing="1">DELIVERY</text>
      <text x="50" y="44" fill="#fafafa" font-weight="600">Comment summary</text>
      <circle cx="0" cy="32" r="5" fill="#8b5cf6" stroke="#0b0b0f" stroke-width="2"/>
    </g>
    <!-- minimap -->
    <rect x="800" y="500" width="140" height="80" rx="8" fill="#111114" stroke="#27272a"/>
    <rect x="812" y="530" width="18" height="8" rx="2" fill="#5e6ad2"/>
    <rect x="838" y="530" width="18" height="8" rx="2" fill="#3f3f46"/>
    <rect x="864" y="528" width="18" height="12" rx="2" fill="#7c3aed"/>
    <rect x="890" y="530" width="18" height="8" rx="2" fill="#3f3f46"/>
    <rect x="890" y="514" width="18" height="8" rx="2" fill="#3f3f46"/>
    <!-- toolbar -->
    <rect x="20" y="20" width="920" height="40" rx="10" fill="#111114" stroke="#27272a"/>
    <text x="36" y="45" fill="#fafafa" font-weight="600">Ticket to pull request</text>
    <rect x="700" y="28" width="70" height="24" rx="6" fill="#18181b" stroke="#27272a"/><text x="714" y="44" fill="#a1a1aa" font-size="11">Validate</text>
    <rect x="778" y="28" width="70" height="24" rx="6" fill="#18181b" stroke="#27272a"/><text x="796" y="44" fill="#a1a1aa" font-size="11">Export</text>
    <rect x="856" y="28" width="72" height="24" rx="6" fill="url(#g)"/><text x="872" y="44" fill="#fff" font-size="11" font-weight="600">Test run</text>
  </g>
</svg>
