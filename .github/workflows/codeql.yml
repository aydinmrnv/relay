# Code scanning, which a public repository gets for free and should therefore
# have switched on.
#
# This is the safeguard that does not depend on anybody remembering to look:
# CodeQL reads the TypeScript in `src/` and the JavaScript in `bin/` and
# `scripts/`, and reports what it finds to the repository's Security tab and,
# for a pull request, onto the pull request itself. Combined with the ruleset in
# .github/rulesets/main.json, a finding is visible before a merge rather than
# after one.
#
# The weekly run matters as much as the per-push one. Queries improve after the
# code stops changing, so a repository that only scans on push stops learning
# anything the day it goes quiet.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # The one write this repository's workflows grant, and only to this job:
      # uploading results is what puts a finding in the Security tab.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
